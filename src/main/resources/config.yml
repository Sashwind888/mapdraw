# MapDraw 插件配置文件

economy:
  enabled: true
  create_cost: 100.0
  upload_cost_per_map: 100.0

upload:
  max_width: 5
  max_height: 5
  max_total_maps: 25

network:
  # 是否开启客户端 Mod 原生网络通信数据包通道
  enabled: true
  # 数据包通信通道标识符 (符合 Minecraft NamespacedKey 标准: 命名空间:通道名)
  channel: "mapdraw:main"
  # 绘制类数据包（0x01 单点 / 0x02 批量 / 0x12 大板全局落笔）每秒最多处理多少个，
  # 超出的直接丢弃（只丢包、不踢人、不回包，最多每 5 秒在控制台提醒一次）。
  # 0 或负数 = 不限制。客户端 Mod 默认不再自己限速，画速限流统一交给这里；
  # 注意 Paper 的 packet-limiter 统计的是「所有」数据包（默认 500/秒），
  # 要放开画速的话记得把它一起调大（paper-global.yml → packet-limiter）。
  max-draw-packets-per-second: 2048

gif:
  enabled: true
  # 动图默认播放帧率 FPS (1 - 20，推荐 5 - 10)
  fps: 8
  # 最大解析帧数，防止超大超长 GIF 耗尽内存
  max_frames: 80
  # 玩家视距检测半径（格），周围无玩家时自动休眠暂停，节省性能
  view_distance: 32

canvas:
  default_size: 128
  allowed_sizes: [16, 32, 64, 128]
  # 画布背景默认颜色字节（34 代表纯白色，若为 0 代表透明/无色）
  default_bg_color: 34
  # 是否默认禁止拷贝
  default_prevent_copy: true
  # 展示框点击映射旋转校准 (0: 0度, 1: 90度, 2: 180度, 3: 270度)
  rotation_offset: 0
  # 连笔平滑插值判定窗口时间 (毫秒)，放宽至 400ms 容忍网络与发包抖动，防快速挥笔断线 (默认 400ms)
  stroke_timeout_ms: 400
  # 连续作画两帧最大允许像素跨距 (像素)，放宽至 800.0 像素支持跨大区域平滑连笔 (默认 800.0)
  max_stroke_distance: 800.0
  # 是否开启调试模式（开启后每次点击展示框会在动作栏/聊天框打印朝向、旋转与坐标）
  debug: false

tools:
  pen:
    # 若启用了 CraftEngine，可填写对应的自定义物品 ID (例如: "mapdraw:pen" 或 "my_items:pen")
    # 若留空或找不到对应 ID，将自动回退使用下面的 material
    craftengine_id: ""
    material: FEATHER
    name: "&b&lMapDraw - 画笔"
    lore:
      - "&7手持此画笔右键展示框绘制单点"
      - "&8(该物品无法用于合成或其它用途)"
  eraser:
    craftengine_id: ""
    material: SHEARS
    name: "&c&lMapDraw - 橡皮擦"
    lore:
      - "&7手持此橡皮擦右键展示框擦除像素"
      - "&8(该物品无法用于合成或其它用途)"
  paintbucket:
    craftengine_id: ""
    material: WATER_BUCKET
    name: "&e&lMapDraw - 油漆桶"
    lore:
      - "&7手持此油漆桶右键展示框泛洪填充连续区域"
      - "&8(该物品无法用于合成或其它用途)"

