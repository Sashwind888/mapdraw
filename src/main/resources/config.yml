help:
  header: "&8§m-----------------&b [MapDraw 帮助手册] &8§m-----------------"
  footer: "&8§m-------------------------------------------------------"
  user_lines:
    - "&e/{label} create [name] [size] &7- 创建一张画布地图"
    - "&e/{label} upload <图片URL> [dither/none] [宽] [高] &7- 上传图片生成单张或多联画"
    - "&e/{label} protect &7- 锁定保护手持画布(需2秒内确认)"
    - "&e/{label} menu &7- 打开可视化控制菜单(手持右键亦可)"
    - "&e/{label} data get &7- 查看手持画布详细数据并同步物品"
    - "&e/{label} data set title <内容> &7- 设置画布标题"
    - "&e/{label} data set description <内容> &7- 设置画布描述"
    - "&e/{label} data set size <大小> &7- 设置画布大小(放大后填色不可缩小)"
    - "&e/{label} draw color [#rrggbb/颜色/&代码] &7- 设定颜色(不填弹16色菜单)"
    - "&e/{label} draw tool <pen/eraser/paintbucket/null> &7- 获取或清空绘图工具"
    - "&e/{label} draw undo &7- 撤销上一步绘制"
    - "&e/{label} draw redo &7- 重做下一步绘制"
  admin_lines:
    - "&6/{label} admin deprotect &7- [作者/管理员] 解除画布保护"
    - "&6/{label} admin reload &7- [管理员] 重载配置文件"
